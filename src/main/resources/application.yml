cors:
  originPatterns: http://localhost:3000,http://localhost:4200,http://localhost:8080
spring:
  main:
    allow-circular-references: true
  application:
    name: parking_system
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

springdoc:
  paths-to-match: /api/**/v1/**
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    use-root-path: true

bootstrap:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
