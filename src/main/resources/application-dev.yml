# Valores de conveniência para rodar localmente. Só valem com SPRING_PROFILES_ACTIVE=dev,
# que também liga o DevDatabaseSeeder (usuários de teste com senha conhecida). Nunca use em produção.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parkingsystem}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234567890}

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-never-use-it-outside-local-development}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
