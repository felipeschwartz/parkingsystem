name: Continuous Integration and Delivery with Github Actions

on:
  push:
    branches:
      - "main"




jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '25'
          cache: maven

      - name: Build Application .jar
        working-directory: ./
        run: mvn clean package

      - name: Docker Compose Build
        working-directory: ./
        run: docker compose build

      - name: Push to Docker Hub Container Registry
        run: |
          docker tag parking-system ${{ secrets.DOCKER_USERNAME }}/parking-system:latest
          docker tag parking-system ${{ secrets.DOCKER_USERNAME }}/parking-system:${{ github.run_id }}

          docker push ${{ secrets.DOCKER_USERNAME }}/parking-system:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/parking-system:${{ github.run_id }}