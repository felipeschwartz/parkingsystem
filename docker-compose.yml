services:
  db:
    image: postgres:16
    restart: always
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: parkingsystem
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    networks:
      - parking-network
  parking-system:
    image: felipeschwartz/parking-system
    restart: always
    build: ./
    working_dir: /
    environment:
      TZ: America/Sao_Paulo
      DB_URL: jdbc:postgresql://db:5432/parkingsystem
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - 8080:8080
    depends_on:
      - db
    networks:
      - parking-network

  # Ferramenta de administração, fora do `up` padrão: docker compose --profile tools up -d
  # Tem acesso total ao Docker do host, então só escuta em localhost (em servidor, acesse por túnel SSH).
  portainer:
    image: portainer/portainer-ce:lts
    profiles: ["tools"]
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data

volumes:
  portainer_data:

networks:
  parking-network:
    driver: bridge
